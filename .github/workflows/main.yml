name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Build with Gradle
        run: ./gradlew build integrationTest
        env:
          ORG_GRADLE_PROJECT_KDGPUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_KDGPPassword: ${{ github.token }}
      - run: ls
      - run: ls gradle-feature/build/jib
      - name: Validate tar file before loading
        run: |
          TAR_FILE="gradle-feature/build/jib/test.tar"
          echo "Tar file size:"
          ls -lh "$TAR_FILE"
          echo "Tar file contents:"
          tar -tf "$TAR_FILE" | head -20
      - run: docker load -i gradle-feature/build/jib/test.tar
      - run: |
          IMAGE_ID=$(docker images jib-example --format '{{.ID}}' | head -n1)
          docker run "$IMAGE_ID"
